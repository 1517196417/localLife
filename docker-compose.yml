version: '3.8'

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:5.7
    container_name: hmdp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ==================== Redis ====================
  redis:
    image: redis:6.2
    container_name: hmdp-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123456 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:3.8-management
    container_name: hmdp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ==================== Elasticsearch ====================
  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: hmdp-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # ==================== 后端应用 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hmdp-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILE: docker
      MYSQL_ROOT_PASSWORD: root123456
      REDIS_PASSWORD: redis123456
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      elasticsearch:
        condition: service_started

  # ==================== Nginx（前端） ====================
  nginx:
    image: nginx:alpine
    container_name: hmdp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./hmdp:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data: