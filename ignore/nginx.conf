# Nginx配置文件 - LocalLife本地生活服务平台
# 用于代理前端静态文件和后端API

# 工作进程数（建议设置为CPU核心数）
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  logs/access.log  main;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # 开启gzip压缩
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    server {
        listen       80;
        server_name  localhost;
        
        # 前端静态文件根目录
        # 修改为你的hmdp目录实际路径
        set $frontend_root "D:/javacode/github_code/localLife/localLife/hmdp";
        
        # ==================== 前端静态文件 ====================
        location / {
            root $frontend_root;
            index index.html index.htm;
            
            # SPA路由支持：如果文件不存在，返回index.html
            try_files $uri $uri/ /index.html;
            
            # 静态文件缓存策略
            location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # ==================== 后端API代理 ====================
        # 代理所有 /api 开头的请求到后端Spring Boot服务
        location /api {
            # 后端服务地址
            proxy_pass http://localhost:8081;
            
            # 代理头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 支持WebSocket（如果需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # ==================== 直接代理后端（可选）====================
        # 如果前端使用相对路径 /user、/shop 等，而不是 /api/user、/api/shop
        # 可以使用这个配置
        # location ~ ^/(user|shop|blog|voucher|upload|follow) {
        #     proxy_pass http://localhost:8080;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }
        
        # ==================== 错误页面 ====================
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
